<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>إحصائيات حافظ الورد</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04110b;
    --card: #0a2418;
    --line: #14402b;
    --green: #2e8b57;
    --gold: #d6a50f;
    --text: #f2f7f4;
    --muted: #8fae9d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .head { text-align: center; margin-bottom: 34px; }
  .head img { width: 84px; height: 84px; border-radius: 50%; display: block; margin: 0 auto 14px; }
  h1 { font-size: 30px; font-weight: 800; }
  .head p { color: var(--muted); margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 560px; }
  .box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
  }
  .box .n {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .box .l { color: var(--muted); font-size: 17px; margin-top: 4px; }
  .status { color: var(--muted); font-size: 14px; margin-top: 22px; min-height: 22px; text-align: center; }
  .status.err { color: #e0786b; }
  a.back { color: var(--green); margin-top: 10px; font-size: 15px; }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .box .n { font-size: 48px; }
  }
</style>
</head>
<body>

<div class="head">
  <img src="logo.png" alt="حافظ الورد">
  <h1>إحصائيات حافظ الورد</h1>
  <p>تتحدث تلقائيا لحظة بلحظة</p>
</div>

<div class="grid">
  <div class="box"><div class="n" id="views">-</div><div class="l">عدد الزيارات</div></div>
  <div class="box"><div class="n" id="downloads">-</div><div class="l">عدد التنزيلات</div></div>
</div>

<p class="status" id="status">جاري التحميل</p>
<a class="back" href="index.html">العودة للموقع</a>

<script src="counter.js"></script>
<script>

  const fmt = new Intl.NumberFormat("ar-EG");
  const status = document.getElementById("status");

  watchStats((s, err) => {
    if (!s) {
      const code = err && err.code ? err.code : "";
      let msg = "تعذر قراءة البيانات.";
      if (code === "permission-denied") msg = "القواعد بتمنع القراءة. اعمل Publish لقواعد Firestore.";
      else if (code === "not-found" || code === "failed-precondition") msg = "قاعدة Firestore مش متعملة. اعمل Create database من لوحة Firebase.";
      else if (code === "unavailable") msg = "مفيش اتصال بـ Firebase أو متحجب من الشبكة.";
      status.textContent = msg + (code ? " (" + code + ")" : "");
      status.className = "status err";
      return;
    }
    document.getElementById("views").textContent = fmt.format(s.views);
    document.getElementById("downloads").textContent = fmt.format(s.downloads);
    status.className = "status";
    status.textContent = "";
  });
</script>

<script>
  // لو الموديول ما اشتغلش خالص (مثلا فتح الملف من الجهاز مباشرة)
  setTimeout(function () {
    var st = document.getElementById("status");
    if (st.textContent === "جاري التحميل") {
      st.className = "status err";
      st.textContent = "الصفحة مش قادرة تجيب الأرقام. اتأكد من النت.";
    }
  }, 4000);
</script>

</body>
</html>
